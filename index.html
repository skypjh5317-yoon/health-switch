<title>몸 속 스위치 ON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 폰 한 화면 폭(최대 560px)의 단일 칼럼 앱. 하단 탭 4개(오늘·스케줄·식단·기록), 본문은 카드 단위. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --fg:#14211b; --muted:#566860; --muted-2:#a3b3aa; --line:#dbe4df;
  --accent:#0a7d58; --accent-ink:#ffffff; --accent-soft:#dcf1e8; --accent-2:#7cc4a6;
  --warn:#bf3b2a; --warn-soft:#fbe6e1; --warn-ink:#ffffff;
  --amber:#7a5200; --amber-soft:#fbf0d4;
  --radius:14px;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1612; --surface:#16211b; --fg:#e6efea; --muted:#9db0a6; --muted-2:#4f6258; --line:#263730;
    --accent:#3fcf98; --accent-ink:#06251a; --accent-soft:#17382b; --accent-2:#2f8a69;
    --warn:#ff8f7a; --warn-soft:#3a1f1a; --warn-ink:#3a0f08;
    --amber:#f0c05a; --amber-soft:#35290f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --fg:#e6efea; --muted:#9db0a6; --muted-2:#4f6258; --line:#263730;
  --accent:#3fcf98; --accent-ink:#06251a; --accent-soft:#17382b; --accent-2:#2f8a69;
  --warn:#ff8f7a; --warn-soft:#3a1f1a; --warn-ink:#3a0f08;
  --amber:#f0c05a; --amber-soft:#35290f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;word-break:keep-all;overflow-wrap:break-word}
#app{max-width:560px;margin-inline:auto;padding-block:8px 104px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{text-wrap:balance}
small{font-size:12.5px}
.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;padding-block:10px 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.switch{width:32px;height:19px;border-radius:10px;background:var(--accent);position:relative;flex:none}
.switch::after{content:"";position:absolute;right:2px;top:2px;width:15px;height:15px;border-radius:50%;background:var(--accent-ink)}
.ghost{padding:0 12px;min-height:36px;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:var(--surface);display:inline-flex;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:600;margin:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.hero h1{font-size:22px;line-height:1.3;margin:10px 0 2px;font-weight:700}
.hl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12.5px;padding:3px 10px;border-radius:999px}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1}
.prog span{font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}

.row{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 0;border-top:1px solid var(--line);min-height:52px;margin-top:8px}
.row + .row{margin-top:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted-2);display:grid;place-items:center;color:transparent;margin-top:1px}
.is-done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rt{min-width:0}
.rt b{display:block;font-weight:600;font-size:15px}
.rt small{display:block;color:var(--muted)}
.is-done .rt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.info{padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:13px;margin-top:8px}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.water{padding:12px 0;border-top:1px solid var(--line);margin-top:8px}
.wtop{display:flex;gap:12px;align-items:flex-start}
.wok .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wnum{margin:10px 0 8px}
.wbig{font-size:30px;font-weight:700;line-height:1.1}
.bar{position:relative}
.bar .mk{position:absolute;top:0;bottom:0;left:66.67%;width:2px;background:var(--surface)}
.wcustom{display:flex;gap:8px;margin-top:10px}
.wcustom input{flex:1;min-width:0}
.acct{display:flex;flex-direction:column;gap:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:38px;display:inline-flex;align-items:center;font-size:13.5px;color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
.tag.ok{background:var(--accent-soft);color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--warn);color:var(--warn-ink)}
.stack{display:flex;flex-direction:column;gap:10px}

.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wkc{text-align:center;display:flex;flex-direction:column;min-width:0}
.wkc b{font-size:16px}
.nav{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:22px;line-height:1}
.ptitle{font-size:19px;margin:6px 0 2px}
.tg{display:grid;grid-template-columns:84px minmax(0,1fr) 52px;align-items:center;gap:10px;padding:6px 0}
.tg .num{text-align:right;font-weight:600}
.day{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.dl{font-weight:600;font-size:15px;line-height:1.3;padding-top:8px}
.dl small{display:block;color:var(--muted);font-weight:400}
.day.today .dl{color:var(--accent)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.two small{display:block;color:var(--muted)}
details.card summary{cursor:pointer;font-weight:600;font-size:15px;min-height:28px}
.gl{margin:10px 0 0;padding:0;list-style:none}
.gl li{padding:8px 0;border-top:1px solid var(--line)}
.gl li b{display:block;font-size:13px;color:var(--accent)}

.kc{margin:6px 0 10px}
.kcal{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);margin-top:6px}
.ent + .ent{margin-top:0}
.en b{font-weight:600}
.en small{display:block;color:var(--muted)}
.ek{text-align:right;font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:18px;line-height:1}
.step .num{min-width:18px;text-align:center;font-weight:600}
.addbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:8px;border:1px dashed var(--muted-2);border-radius:10px;color:var(--accent);font-weight:600}

.form label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.form .btn{margin-top:16px}
.seg{display:flex;gap:6px;margin:10px 0}
.seg .chip{flex:1;justify-content:center;padding:0 8px}
svg.ch{width:100%;height:auto;display:block;margin-top:6px}
.ax{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
.gr{stroke:var(--line);stroke-width:1}
.ln{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--accent)}
.vl{fill:var(--fg);font-size:11px;font-weight:600;font-family:var(--font)}
.b1{fill:var(--accent)}
.b2{fill:var(--accent-2)}
.b3{fill:var(--muted-2)}
.ref{stroke:var(--fg);stroke-dasharray:4 4;opacity:.45;stroke-width:1}
.empty{padding:18px 0;text-align:center}
.rl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rl button{color:var(--muted);min-height:36px;padding:0 8px}
.rl b{font-weight:600}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:var(--muted);font-size:12px;text-align:center}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:86%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-h b{font-size:16px}
.sheet-body{overflow-y:auto;min-height:0;flex:1}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:10px;align-items:center;width:100%;padding:11px 0;border-top:1px solid var(--line);min-height:52px}
.fn b{font-weight:600}
.fn small{display:block;color:var(--muted)}
.fk{font-weight:600;font-variant-numeric:tabular-nums}
.plus{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:13px;max-width:calc(100% - 32px);text-align:center}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><span class="switch" aria-hidden="true"></span>몸 속 스위치 ON</div>
    <button class="ghost" id="setbtn" data-a="settings">설정</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="화면 이동">

    <button class="tab" data-a="tab" data-v="diet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.5 1.5-1.5 1.5-3M14 7c0-1.5 1.5-1.5 1.5-3"/></svg>식단</button>

  </div>
</nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}

function rangeStart(){

function chartW(dMin,dMax){
  var pts=recList().filter(function(d){return S.rec[d].w!=null&&d>=dMin&&d<=dMax}).map(function(d){return {d:d,v:S.rec[d].w}});
  if(!pts.length)return '<p class="mut empty">체중을 기록하면 변화 그래프가 그려져요.</p>';
  var W=360,H=200,L=38,R=14,Tp=18,B=26,same=dMin===dMax,span=Math.max(1,diffDays(dMax,dMin));
  var vs=pts.map(function(p){return p.v});
  var lo=Math.floor(Math.min.apply(null,vs)-0.5),hi=Math.ceil(Math.max.apply(null,vs)+0.5);
  hi=lo+Math.max(1,Math.ceil((hi-lo)/3))*3;
  var X=function(d){return same?(L+W-R)/2:L+diffDays(d,dMin)/span*(W-L-R)};
  var Y=function(v){return Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B)};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="체중 변화 그래프">';
  for(var k=0;k<=3;k++){var v=lo+(hi-lo)*k/3,y=Y(v);s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+v+'</text>'}
  var labs=same?[[dMin,'middle',X(dMin)]]:[[dMin,'start',L],[addDays(dMin,Math.round(span/2)),'middle',(L+W-R)/2],[dMax,'end',W-R]];
  labs.forEach(function(a){s+='<text class="ax" x="'+a[2]+'" y="'+(H-8)+'" text-anchor="'+a[1]+'">'+short(a[0])+'</text>'});
  if(pts.length>1)s+='<polyline class="ln" points="'+pts.map(function(p){return X(p.d).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p){s+='<circle class="dot" cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5"/>'});
  var lp=pts[pts.length-1];
  s+='<text class="vl" x="'+Math.min(W-R-14,Math.max(L+14,X(lp.d))).toFixed(1)+'" y="'+(Y(lp.v)-9).toFixed(1)+'" text-anchor="middle">'+lp.v+'kg</text></svg>';
  return s;
}
function chartS(dMin,dMax){
  var days=[],d=dMin;
  while(d<=dMax&&days.length<400){days.push(d);d=addDays(d,1)}
  var vals=days.map(function(x){return S.rec[x]&&S.rec[x].s!=null?S.rec[x].s:null});
  var present=vals.filter(function(v){return v!=null});
  if(!present.length)return '<p class="mut empty">걸음수를 기록하면 막대 그래프가 그려져요.</p>';
  var W=360,H=200,L=38,R=10,Tp=12,B=26,mx=Math.max.apply(null,present);
  var step=mx<=10000?2000:5000,yMax=Math.max(8000,Math.ceil(mx/step)*step);
  var n=days.length,slot=(W-L-R)/n,bw=Math.max(2,slot*0.66);
  var Y=function(v){return Tp+(1-v/yMax)*(H-Tp-B)};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="일별 걸음수 막대 그래프">';
  for(var v=0;v<=yMax;v+=step){s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+fmt(v)+'</text>'}
  vals.forEach(function(val,i){
    if(val==null)return;
    var cls=val>=7000?'b1':(val>=5000?'b2':'b3'),x=L+slot*i+(slot-bw)/2,y=Y(val);
    s+='<rect class="'+cls+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,Y(0)-y).toFixed(1)+'" rx="1.5"/>';
  });
  s+='<line class="ref" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(7000)+'" y2="'+Y(7000)+'"/><line class="ref" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(5000)+'" y2="'+Y(5000)+'" opacity=".25"/>';
  var labs=n===1?[[days[0],'middle',(L+W-R)/2]]:[[days[0],'start',L],[days[Math.floor((n-1)/2)],'middle',(L+W-R)/2],[days[n-1],'end',W-R]];
  labs.forEach(function(a){s+='<text class="ax" x="'+a[2]+'" y="'+(H-8)+'" text-anchor="'+a[1]+'">'+short(a[0])+'</text>'});
  return s+'</svg>';
}

  var cw=wl.length?S.rec[wl[wl.length-1]].w:null,chg='';
  if(wl.length>1){var df=Math.round((cw-S.rec[wl[0]].w)*10)/10;chg=(df>0?'+':(df<0?'−':''))+Math.abs(df).toFixed(1)+'kg'}else if(wl.length===1)chg='첫 기록';
  var last7=recList().filter(function(d){return d>addDays(t,-7)&&S.rec[d].s!=null}).map(function(d){return S.rec[d].s});
  var avg=last7.length?Math.round(last7.reduce(function(a,b){return a+b},0)/last7.length):null;
  h+='<section class="card"><div class="two"><div><small>현재 체중</small><b>'+(cw!=null?cw+'kg':'–')+'</b><small>시작 대비 '+(chg||'–')+'</small></div><div><small>최근 7일 평균</small><b>'+(avg!=null?fmt(avg):'–')+'</b><small>걸음수(기록한 날 기준)</small></div></div></section>';
  h+='<div class="seg" role="group" aria-label="기간">'+[[14,'14일'],[30,'30일'],[0,'전체']].map(function(a){return '<button class="chip" aria-pressed="'+(recRange===a[0])+'" data-a="range" data-v="'+a[0]+'">'+a[1]+'</button>'}).join('')+'</div>';
  h+='<section class="card"><h2>체중 변화</h2>'+chartW(dMin,dMax)+'</section>';
  h+='<section class="card"><h2>일별 걸음수</h2>'+chartS(dMin,dMax)+'<p class="hint">점선은 목표 7,000보와 최소 5,000보예요.</p></section>';
  var rl=recList().slice(-7).reverse();
  if(rl.length){
    h+='<section class="card"><h2>최근 기록</h2>';
    rl.forEach(function(d){var r=S.rec[d];h+='<div class="rl"><div><b>'+short(d)+' '+DOW[pd(d).getDay()]+'</b> <span class="mut num">'+(r.w!=null?r.w+'kg':'')+(r.w!=null&&r.s!=null?' · ':'')+(r.s!=null?fmt(r.s)+'보':'')+'</span></div><button data-a="delRec" data-d="'+d+'" aria-label="'+short(d)+' 기록 삭제">삭제</button></div>'});
    h+='</section>';
  }
  return h;
}

function render(){
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-current',b.dataset.v===tab?'page':'false')});
  var fn={today:vToday,sched:vSched,diet:vDiet,rec:vRec}[tab];

}
function foodList(){
  var q=sheet.q.trim().toLowerCase(),out='';
  FOODS.forEach(function(f,i){
    if(sheet.tab!=='all'&&f.c!==sheet.tab)return;
    if(q&&f.n.toLowerCase().indexOf(q)<0)return;
    out+='<button class="frow" data-a="pick" data-i="'+i+'"><span class="fn"><b>'+esc(f.n)+'</b>'+(f.c==='no'?' <span class="tag">금기</span>':'')+'<small>'+esc(f.u)+'</small></span><span class="fk">'+f.k+' kcal</span><span class="plus" aria-hidden="true">+</span></button>';
  });
  return out||'<p class="mut empty">찾는 음식이 없어요. 직접 입력에서 추가할 수 있어요.</p>';
}
function acctHtml(){

  if(!A||!A.configured)return h2+'<p class="hint" style="margin-top:0">Firebase 설정을 넣으면 구글 로그인으로 기록을 저장할 수 있어요. 지금은 이 브라우저에만 저장돼요.</p>';
  if(A.user)return h2+'<div class="acct"><b>'+esc(A.user.email)+'</b><span class="mut">'+esc(A.status||'')+'</span></div><button class="btn sec" data-a="logout" style="margin-top:10px">로그아웃</button><p class="hint">기록은 로그인한 구글 계정에 저장되고, 다른 기기에서도 같은 계정으로 이어 볼 수 있어요.</p>';
  return h2+'<button class="btn" data-a="login" style="margin-top:6px">구글로 로그인</button><p class="hint">'+esc(A.status||'로그인하면 기록이 구글 계정에 저장돼요.')+'</p>';
}
function drawSheet(){
  if(!sheet){$sheet.hidden=true;$sheet.innerHTML='';return}
  $sheet.hidden=false;
  if(sheet.kind==='foods'){
    var mn=MEALS.filter(function(x){return x[0]===sheet.m})[0][1];
    var seg=[['all','전체'],['ok','허용'],['no','금기'],['custom','직접 입력']].map(function(a){return '<button class="chip" aria-pressed="'+(sheet.tab===a[0])+'" data-a="stab" data-v="'+a[0]+'">'+a[1]+'</button>'}).join('');
    var body=sheet.tab==='custom'
      ?'<div class="form"><label for="cn">음식 이름</label><input id="cn" type="text" maxlength="40"><label for="ck">칼로리 (kcal)</label><input id="ck" type="number" inputmode="numeric" min="0" max="5000"><button class="btn" data-a="custom">추가</button></div>'
      :'<div id="flist">'+foodList()+'</div>';
    $sheet.innerHTML='<div class="sheet-bg" data-a="close"></div><div class="sheet" role="dialog" aria-label="'+mn+' 음식 추가"><div class="sheet-h"><b>'+mn+' 음식 추가</b><button class="ghost" data-a="close">닫기</button></div>'
      +(sheet.tab==='custom'?'':'<input id="fq" type="search" placeholder="음식 검색" value="'+esc(sheet.q)+'">')
      +'<div class="seg">'+seg+'</div><div class="sheet-body">'+body+'</div></div>';
  }else{
    $sheet.innerHTML='<div class="sheet-bg" data-a="close"></div><div class="sheet" role="dialog" aria-label="설정"><div class="sheet-h"><b>설정</b><button class="ghost" data-a="close">닫기</button></div><div class="sheet-body form">'
      +acctHtml()
      +'<label for="sd" style="margin-top:22px">프로그램 시작일</label><input id="sd" type="date" value="'+S.start+'">'
      +'<button class="btn" data-a="saveStart">시작일 저장</button>'
      +'<p class="hint">시작일을 기준으로 1주차, 2~3주차, 유지기가 정해져요.</p>'
      +'<button class="btn '+(confirmReset?'danger':'sec')+'" data-a="reset" style="margin-top:24px">'+(confirmReset?'정말 지울까요? 한 번 더 누르면 모두 삭제':'모든 기록 지우기')+'</button>'
      +'<p class="hint">기록은 이 폰의 브라우저에만 저장돼요. 브라우저 데이터를 지우면 함께 사라져요.</p></div></div>';
  }
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,ds_=b.dataset.d,k=b.dataset.k,v=b.dataset.v,refocus=null;
  if(a==='tab'){
    tab=v;if(b.dataset.reset)dietDate=T();if(tab==='sched')viewW=null;confirmRec=false;render();window.scrollTo(0,0);return;
  }
  if(a==='done'){
    var o=S.done[ds_]=S.done[ds_]||{};
    if(o[k])delete o[k];else o[k]=true;
    if(!Object.keys(o).length)delete S.done[ds_];
    save();refocus='[data-a="done"][data-d="'+ds_+'"][data-k="'+k+'"]';
  }else if(a==='sched'){
    var l=(S.sched[ds_]||[]).slice(),ix=l.indexOf(k);
    if(ix>=0)l.splice(ix,1);else l.push(k);
    l.sort(function(x,y){return ORDER.indexOf(x)-ORDER.indexOf(y)});
    if(l.length)S.sched[ds_]=l;else delete S.sched[ds_];
    confirmRec=false;save();refocus='[data-a="sched"][data-d="'+ds_+'"][data-k="'+k+'"]';
  }else if(a==='recommend'){
    var w=viewW==null?weekOf(T()):viewW;
    var has=weekDates(w).some(function(d){return (S.sched[d]||[]).length});
    if(has&&!confirmRec){confirmRec=true;render();return}
    recommend(w);confirmRec=false;save();toast('추천 스케줄을 채웠어요');
  }else if(a==='login'){
    if(window.hwLogin)window.hwLogin();return;
  }else if(a==='logout'){
    if(window.hwLogout)window.hwLogout();return;
  }else if(a==='water'||a==='watercustom'){
    var ml=a==='water'?Number(v):Math.round(Number(document.getElementById('wc').value));
    if(!(ml>0&&ml<=3000)){toast('1~3000ml 사이로 입력해 주세요');return}
    var t0=T(),before=waterTotal(t0);
    (S.water[t0]=S.water[t0]||[]).push(ml);save();
    if(before<1000&&waterTotal(t0)>=1000)toast('1L를 넘었어요. 점검표에 체크했어요');
    if(a==='water')refocus='[data-a="water"][data-v="'+v+'"]';
  }else if(a==='waterundo'){
    var t1=T(),w0=S.water[t1]||[];
    w0.pop();if(!w0.length)delete S.water[t1];save();
  }else if(a==='planweek'){
    var w2=weekOf(T());
    var has2=weekDates(w2).some(function(d){return (S.sched[d]||[]).length});
    if(has2){tab='sched';viewW=null}else{recommend(w2);save();toast('추천 스케줄을 채웠어요. 스케줄 탭에서 바꿀 수 있어요')}
  }else if(a==='wk'){
    viewW=Math.max(1,(viewW==null?weekOf(T()):viewW)+Number(v));confirmRec=false;
  }else if(a==='dietday'){
    var nd=addDays(dietDate,Number(v));dietDate=nd>T()?T():nd;
  }else if(a==='open'){
    sheet={kind:'foods',m:b.dataset.m,tab:'all',q:''};drawSheet();return;
  }else if(a==='qty'){
    var L=S.meals[dietDate]||[],it=L[Number(b.dataset.i)];
    if(it){it.q+=Number(v);if(it.q<=0)L.splice(Number(b.dataset.i),1);if(!L.length)delete S.meals[dietDate];save()}
  }else if(a==='pick'){
    var f=FOODS[Number(b.dataset.i)],L2=S.meals[dietDate]=S.meals[dietDate]||[];
    var ex=L2.filter(function(x){return x.m===sheet.m&&x.n===f.n&&x.u===f.u&&x.k===f.k})[0];
    if(ex)ex.q++;else L2.push({m:sheet.m,n:f.n,u:f.u,k:f.k,c:f.c,q:1});
    save();toast(f.n+' 추가했어요');
  }else if(a==='stab'){
    sheet.tab=v;drawSheet();return;
  }else if(a==='custom'){
    var nm=document.getElementById('cn').value.trim(),kc=Math.round(Number(document.getElementById('ck').value));
    if(!nm||!(kc>=0)||document.getElementById('ck').value===''){toast('이름과 칼로리를 입력해 주세요');return}
    var L3=S.meals[dietDate]=S.meals[dietDate]||[];
    L3.push({m:sheet.m,n:nm,u:'',k:kc,c:'x',q:1});
    save();toast(nm+' 추가했어요');
    document.getElementById('cn').value='';document.getElementById('ck').value='';
  }else if(a==='close'){
    sheet=null;confirmReset=false;drawSheet();return;
  }else if(a==='settings'){
    sheet={kind:'settings'};confirmReset=false;drawSheet();return;
  }else if(a==='saveStart'){
    var sv=document.getElementById('sd').value;
    if(!sv){toast('날짜를 선택해 주세요');return}
    S.start=sv;viewW=null;save();sheet=null;drawSheet();toast('시작일을 저장했어요');
  }else if(a==='reset'){
    if(!confirmReset){confirmReset=true;drawSheet();return}
    try{localStorage.removeItem(KEY)}catch(e2){}
    S=null;load();confirmReset=false;sheet=null;drawSheet();toast('기록을 모두 지웠어요');
  }else if(a==='range'){
    recRange=Number(v);
  }else if(a==='saveRec'){
    var wv=document.getElementById('rw').value,sv2=document.getElementById('rs').value;
    var wn=wv===''?null:Math.round(Number(wv)*10)/10,sn=sv2===''?null:Math.round(Number(sv2));
    if(wn!=null&&!(wn>=20&&wn<=300)){toast('체중은 20~300kg 사이로 입력해 주세요');return}
    if(sn!=null&&!(sn>=0&&sn<=100000)){toast('걸음수를 확인해 주세요');return}
    var r={};if(wn!=null)r.w=wn;if(sn!=null)r.s=sn;
    if(Object.keys(r).length)S.rec[recDate]=r;else delete S.rec[recDate];
    save();toast('저장했어요');
  }else if(a==='delRec'){
    delete S.rec[ds_];save();
  }
  render();
  if(refocus){var el=document.querySelector(refocus);if(el)el.focus({preventScroll:true})}
});
document.addEventListener('input',function(e){
  if(e.target.id==='fq'&&sheet){sheet.q=e.target.value;var fl=document.getElementById('flist');if(fl)fl.innerHTML=foodList()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='rd'&&e.target.value){recDate=e.target.value>T()?T():e.target.value;render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet){sheet=null;confirmReset=false;drawSheet()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});

window.hwApi={
  get:function(){return S},
  set:function(o){
    S=(o&&typeof o==='object')?o:{};
    S.start=S.start||T();S.sched=S.sched||{};S.done=S.done||{};S.rec=S.rec||{};S.meals=S.meals||{};S.water=S.water||{};
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();
  }
};
window.hwRefreshUI=function(){
  var A=window.hwAuth,btn=document.getElementById('setbtn');
  if(btn)btn.textContent=(A&&A.configured&&!A.user)?'로그인':'설정';
  if(sheet&&sheet.kind==='settings')drawSheet();
};
load();render();
})();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* 아래 값은 Firebase 콘솔의 "웹 앱" 설정에서 복사해 이 자리에 붙여넣어요. (README.md 5단계) */
const firebaseConfig={
  apiKey:'YOUR_API_KEY',
  authDomain:'YOUR_PROJECT_ID.firebaseapp.com',
  projectId:'YOUR_PROJECT_ID',
  storageBucket:'YOUR_PROJECT_ID.appspot.com',
  messagingSenderId:'YOUR_SENDER_ID',
  appId:'YOUR_APP_ID'
};

const A=window.hwAuth={configured:firebaseConfig.apiKey!=='YOUR_API_KEY',user:null,status:''};
const refresh=function(){if(window.hwRefreshUI)window.hwRefreshUI()};

if(A.configured){
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  const db=getFirestore(app);
  const provider=new GoogleAuthProvider();
  let uid=null,ready=false,timer=null;

  async function push(){
    try{
      await setDoc(doc(db,'users',uid),{data:JSON.stringify(window.hwApi.get()),updatedAt:Date.now()});
      A.status='동기화됨';
    }catch(e){
      A.status='저장하지 못했어요. 인터넷 연결을 확인해 주세요.';
    }
    refresh();
  }

  window.hwSync=function(){
    if(!uid||!ready)return;
    clearTimeout(timer);
    A.status='저장 중…';refresh();
    timer=setTimeout(push,800);
  };

  window.hwLogin=async function(){
    try{
      await signInWithPopup(auth,provider);
    }catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
        try{await signInWithRedirect(auth,provider)}catch(e2){A.status='로그인하지 못했어요 ('+e2.code+')';refresh()}
      }else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){
        A.status='로그인하지 못했어요 ('+e.code+')';refresh();
      }
    }
  };

  window.hwLogout=async function(){
    try{await signOut(auth)}catch(e){}
  };

  getRedirectResult(auth).catch(function(e){A.status='로그인하지 못했어요 ('+e.code+')';refresh()});

  onAuthStateChanged(auth,async function(u){
    if(!u){
      uid=null;ready=false;A.user=null;A.status='';refresh();
      return;
    }
    uid=u.uid;
    A.user={name:u.displayName||'',email:u.email||''};
    A.status='불러오는 중…';refresh();
    try{
      const snap=await getDoc(doc(db,'users',uid));
      if(snap.exists()){
        const remote=JSON.parse(snap.data().data);
        try{localStorage.setItem('hw_switch_v1_backup',localStorage.getItem('hw_switch_v1')||'')}catch(e){}
        window.hwApi.set(remote);
        ready=true;A.status='동기화됨';
      }else{
        ready=true;
        await push();
      }
    }catch(e){
      ready=false;
      A.status='불러오지 못했어요. 인터넷 연결을 확인해 주세요.';
    }
    refresh();
  });
}
refresh();
</script>
